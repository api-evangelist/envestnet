- aid: envestnet:envestnet-account-token-api
  name: Envestnet Account Token API
  description: >-
    Account verification customers looking to integrate with one of our payment partners can use the Account
    Token endpoints. These APIs allow creating a secure processor token for your user's verified financial
    accounts. You can then share the processor token with our payment partners to enable them to securely
    request the user's account details from Envestnet | Yodlee.<br><br>You will have to set the header
    before making the API call. The following headers apply to all the APIs:</p><ul><li>Authorization:
    This header holds the access token</li> <li> Api-Version: 1.1</li></ul><b>Note</b>: If there are any
    API-specific headers, they are mentioned explicitly in the respective API's description.<p></p>
  humanURL: https://developer.envestnet.com/products/yodlee/account-aggregation
