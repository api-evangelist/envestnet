openapi: 3.2.0
info:
  title: Envestnet Account Token Payment Processor API
  description: 'Financial institutions (FIs) or FinTech customers using the account verification product to provide digital payment services can eliminate the risk of storing users'' sensitive financial account information using Account Token endpoints. The endpoints allow customers to create an account-specific token that the payment processors can use to retrieve account information.


    Payment processors who have a processorToken can exchange these tokens for account data using Payment Processor endpoints.'
  termsOfService: https://developer.yodlee.com/terms/condition
  contact:
    email: developer@yodlee.com
  license:
    name: Yodlee Developer License
    url: https://developer.yodlee.com/terms/condition#_Services_1
  version: 1.1.0
servers:
- url: /
tags:
- name: Payment Processor
  description: Envestnet | Yodlee's payment processor partners can use the Payment Processor endpoints to access verified account details using the processorToken created and shared by mutual customers.
paths:
  /partner/paymentProcessor/account/holder:
    get:
      tags:
      - Payment Processor
      summary: Envestnet Get Account Holder Details
      description: 'The get account holder details service retrieves the account holder information such as name, email, phone number, address, etc. of the verified financial account associated with the processorToken. The lastUpdated field indicates when the account information was last updated. We recommend using this service when looking for information related to the account holder(s), for instance, to confirm the account holder''s name.


        Note: Remember to include the Authorization header.'
      operationId: getVerifiedAccountHolder
      parameters:
      - name: processorToken
        in: header
        description: Token shared by customer to access financial account information.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PaymentAccountHolderResponse'
        '400':
          description: 'Y007 : Authorization header missing<br>Y008 : Invalid token in authorization header<br>Y800 : Invalid value for processorToken<br>Y016 : processorToken header missing'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/YodleeError'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not Found
          content: {}
      deprecated: false
  /partner/paymentProcessor/account:
    get:
      tags:
      - Payment Processor
      summary: Envestnet Get Account Details
      description: 'The get account details service retrieves account information such as account name, type, status, balance, account number and transfer code (for example, routing number of the bank account in the US) of the verified account associated with the processorToken. The lastUpdated field indicates when the account information was last updated. We recommend using this service when looking for details related to the financial account, for instance, the full account number and bank transfer code for initiating a payment.


        Note: Remember to include the Authorization header.'
      operationId: getVerifiedAccount
      parameters:
      - name: processorToken
        in: header
        description: Token shared by customer to access financial account information.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PaymentAccountResponse'
        '400':
          description: 'Y007 : Authorization header missing<br>Y008 : Invalid token in authorization header<br>Y800 : Invalid value for processorToken<br>Y016 : processorToken header missing'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/YodleeError'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not Found
          content: {}
      deprecated: false
  /partner/paymentProcessor/account/balance:
    get:
      tags:
      - Payment Processor
      summary: Envestnet Get Account Balance
      description: 'The get account balance service retrieves the account balance information of the verified account associated with the processorToken. The response returns additional account information including account names, type and status, along with the account balance information.

        This service forces an update of the account balances. While other services also return the account balances, this service attempts to refresh the account balances in real-time rather than return a cached value. Refer to the lastUpdated field to determine when the account balances were refreshed. We recommend using this service when looking for the latest balance for the account.

        While posting a debit against an account, it is generally advisable to check the available balance field to verify the availability of sufficient funds. This service returns both available and current balances:


        Available Balance is the amount in the account that is available for spending. The value is aggregated from the FI. For checking accounts with overdrafts, the available balance amount may include the overdraft amount if the FI adds the overdraft balance to the available balance.


        Current Balance is the total amount of money in the account, aggregated from the FI.


        Note: Remember to include the Authorization header.'
      operationId: getVerifiedAccountBalance
      parameters:
      - name: processorToken
        in: header
        description: Token shared by customer to access financial account information.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PaymentAccountBalanceResponse'
        '400':
          description: 'Y007 : Authorization header missing<br>Y008 : Invalid token in authorization header<br>Y800 : Invalid value for processorToken<br>Y016 : processorToken header missing'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/YodleeError'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not Found
          content: {}
      deprecated: false
components:
  schemas:
    PaymentAccount:
      title: PaymentAccount
      type: object
      properties:
        accountStatus:
          type: string
          description: The status of the account that is updated by the user through an application or an API.</li><ul><li><b>ACTIVE:</b> All the added aggregated accounts status will be made "ACTIVE" by default.</li><li><b>TO_BE_CLOSED:</b> If the aggregated accounts are not found or closed in the data provider site, Yodlee system marks the status as TO_BE_CLOSED.</li><li><b>INACTIVE:</b> Users can update the status as INACTIVE to stop updating and to stop considering the account in other services.</li><li><b>CLOSED:</b> Users can update the status as CLOSED, if the account is closed with the provider.</li></ul><b>Endpoints</b>:<ul><li>GET /partner/paymentProcessor/account</li><li>GET /partner/paymentProcessor/account/balance</li><li>GET /partner/paymentProcessor/account/holder</li></ul>
          readOnly: true
          enum:
          - ACTIVE
          - INACTIVE
          - TO_BE_CLOSED
          - CLOSED
          - DELETED
        lastUpdated:
          type: string
          description: The date time the account information was last retrieved from the provider site and updated in the Yodlee system.<br><b>Endpoints</b>:<ul><li>GET /partner/paymentProcessor/account</li><li>GET /partner/paymentProcessor/account/balance</li><li>GET /partner/paymentProcessor/account/holder</li></ul>
          readOnly: true
        accountName:
          type: string
          description: The account name as it appears at the site.<br><b>Endpoints</b>:<ul><li>GET /partner/paymentProcessor/account</li><li>GET /partner/paymentProcessor/account/balance</li><li>GET /partner/paymentProcessor/account/holder</li></ul>
          readOnly: true
        accountType:
          type: string
          description: The type of account that is aggregated, i.e., savings, checking, charge, etc. The account type is derived based on the attributes of the account. <br><b>Endpoints</b>:<ul><li>GET /partner/paymentProcessor/account</li><li>GET /partner/paymentProcessor/account/balance</li><li>GET /partner/paymentProcessor/account/holder</li></ul>
          readOnly: true
        currentBalance:
          $ref: '#/components/schemas/Money'
        id:
          type: integer
          description: The primary key of the account resource and the unique identifier for the account.<br><br><b>Endpoints</b>:<ul><li>GET /partner/paymentProcessor/account</li><li>GET /partner/paymentProcessor/account/balance</li><li>GET /partner/paymentProcessor/account/holder</li></ul>
          format: int64
          readOnly: true
        bankTransferCode:
          type: array
          description: Bank and branch identification information.<br><br><b>Endpoints</b>:<ul><li>GET /partner/paymentProcessor/account</li></ul>
          readOnly: true
          items:
            $ref: '#/components/schemas/PaymentBankTransferCodeData'
        availableBalance:
          $ref: '#/components/schemas/Money'
        fullAccountNumberList:
          $ref: '#/components/schemas/FullAccountNumbers'
    FullAccountNumbers:
      title: FullAccountNumbers
      type: object
      properties:
        paymentAccountNumber:
          type: string
          description: The payment account number is used for payments in all regions, this may be looked as an ACH account number in the US.<br><b>Endpoints</b>:<ul><li>GET /partner/paymentProcessor/account</li></ul>
          readOnly: true
        unmaskedAccountNumber:
          type: string
          description: The unmasked account number is same as account number that is used to refer to an account and is not partial or masked.<br><b>Endpoints</b>:<ul><li>GET /partner/paymentProcessor/account</li></ul>
          readOnly: true
