openapi: 3.2.0
info:
  title: Envestnet Account Token API
  version: 1.1.0
  contact:
    email: developer@yodlee.com
  license:
    name: Yodlee Developer License
    url: https://developer.yodlee.com/terms/condition#_Services_1
  termsOfService: https://developer.yodlee.com/terms/condition
  description: 'Operations tagged Account Token across 2 of this provider''s published API definitions: envestnet-account-token-openapi-original.yml, envestnet-verification-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
tags:
- name: Account Token
  description: Account verification customers looking to integrate with one of our payment partners can use the Account Token endpoints.
paths:
  /paymentProcessor/token:
    post:
      tags:
      - Account Token
      summary: Envestnet Create Account Token
      description: The create account token service allows you to create a secure processorToken for a user's verified financial account. This processorToken can then be shared with one of our payment processor partners.
      operationId: generatePaymentProcessorToken
      requestBody:
        description: account information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentProcessorTokenRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PaymentProcessorTokenResponse'
        '400':
          description: 'Y007 : Authorization header missing<br>Y008 : Invalid token in authorization header<br>Y833 : Invalid values(s) for accountId<br>Y800 : Invalid value for processor<br>Y813 : accountId should be provided<br>Y813 : processor should be provided'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/YodleeError'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not Found
          content: {}
      deprecated: false
      x-codegen-request-body-name: tokenRequest
    delete:
      tags:
      - Account Token
      summary: Envestnet Delete Account Token
      description: The delete account token service allows you to revoke a previously generated processorToken. It is recommended to use this service when you want to disallow further access to the user's financial account, for instance when a user removes their account from your application.
      operationId: revokePaymentProcessorToken
      parameters:
      - name: processorToken
        in: header
        description: The token that you want to delete.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: 'Y007 : Authorization header missing<br>Y008 : Invalid token in authorization header<br>Y016 : processorToken header missing'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/YodleeError'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not Found
          content: {}
      deprecated: false
    servers:
    - url: /
components:
  schemas:
    PaymentProcessorTokenResponse:
      title: PaymentProcessorTokenResponse
      type: object
      properties:
        token:
          type: array
          description: token
          readOnly: true
          items:
            $ref: '#/components/schemas/AccountToken'
    YodleeError:
      title: YodleeError
      type: object
      properties:
        errorMessage:
          type: string
        errorCode:
          type: string
        referenceCode:
          type: string
    PaymentProcessorTokenRequest:
      title: PaymentProcessorTokenRequest
      required:
      - accountId
      - processor
      type: object
      properties:
        accountId:
          type: array
          description: The unique identifier for the user's account.
          items:
            type: integer
            format: int64
        processor:
          type: string
          description: The payment processor with whom the customer is integrating.
    AccountToken:
      title: AccountToken
      type: object
      properties:
        processorToken:
          type: string
          description: The unique token that the payment partner can use to make API request to the Envestnet | Yodlee system.
          readOnly: true
        accountId:
          type: integer
          description: The unique identifier for the user's account.
          format: int64
          readOnly: true
    YodleeError_2:
      title: YodleeError
      type: object
      properties:
        errorMessage:
          type: string
          description: The descriptive message that explains the error scenario.
          readOnly: true
        errorCode:
          type: string
          description: The error code follows the format YNNN. The error codes do not change. New error codes may be added as we introduce new features and enhance functionalities.
          readOnly: true
        referenceCode:
          type: string
          description: Unique Yodlee identifier used to troubleshoot issues at Yodlee's end.
          readOnly: true
x-refined-from:
- envestnet-account-token-openapi-original.yml
- envestnet-verification-openapi-original.yml
